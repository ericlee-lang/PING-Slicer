name: Build all

on:
  push:
    branches:
     - main
     - release/*
    paths:
     - 'deps/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - 'localization/**'
     - 'resources/**'
     - ".github/workflows/build_*.yml"
     - 'scripts/flatpak/**'

  pull_request:
    branches:
     - main
     - release/*
    paths:
     - 'deps/**'
     - 'deps_src/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - ".github/workflows/build_*.yml"
     - 'build_linux.sh'
     - 'build_release_vs2022.bat'
     - 'build_release_macos.sh'
     - 'scripts/flatpak/**'


  schedule:
      - cron: '0 17 * * *' # run once a day at 1 AM Singapore time (UTC+8)

  workflow_dispatch: # allows for manual dispatch
    inputs:
      build-deps-only:
        description: 'Only build dependencies (bypasses caching)'
        type: boolean
        default: false
      run-flatpak:
        description: 'Also build the Linux Flatpak (off by default - see the flatpak job)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  

jobs:
  build_linux:
    strategy:
      fail-fast: false
    # Don't run scheduled builds on forks:
    if: ${{ !cancelled() && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-lnx-server' || 'ubuntu-24.04' }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
    secrets: inherit
  build_windows:
    # Don't run scheduled builds on forks:
    if: ${{ !cancelled() && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-win-server' || 'windows-latest' }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
      force-build: ${{ github.event_name == 'schedule' }}
    secrets: inherit
  build_macos_arch:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x86_64
    # Don't run scheduled builds on forks:
    if: ${{ !cancelled() && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-macos-arm64' || 'macos-14' }}
      arch: ${{ matrix.arch }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
      force-build: ${{ github.event_name == 'schedule' }}
    secrets: inherit
  build_macos_universal:
    name: Build macOS Universal
    needs: build_macos_arch
    if: ${{ !cancelled() && needs.build_macos_arch.result == 'success' && !inputs.build-deps-only && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_orca.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-macos-arm64' || 'macos-14' }}
      arch: universal
      macos-combine-only: true
    secrets: inherit
  unit_tests:
    name: Unit Tests
    runs-on: ${{ vars.SELF_HOSTED && 'orca-lnx-server' || 'ubuntu-24.04' }}
    needs: build_linux
    if: ${{ !cancelled() && success() }}
    # Least-privilege: declaring any scope sets every unlisted scope to none,
    # so contents/actions must be listed too (checkout + delete-artifact need them).
    permissions:
      contents: read   # actions/checkout
      checks: write    # publish-unit-test-result-action creates the check run
      actions: write   # geekyeggo/delete-artifact removes the test artifact
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            scripts
            tests
      - name: Apt-Install Dependencies
        if: ${{ !vars.SELF_HOSTED }}
        uses: ./.github/actions/apt-install-deps
      - name: Restore Test Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ github.sha }}-tests
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"  # use most recent 4.3.x version
          useLocalCache: true         # <--= Use the local cache (default is 'false').
          useCloudCache: true
      - name: Unpackage and Run Unit Tests
        timeout-minutes: 20
        run: |
          tar -xvf build_tests.tar
          scripts/run_unit_tests.sh
      - name: Upload Test Logs
        uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: unit-test-logs
          path: build/tests/**/*.log
      # Best-effort: a read-only token (e.g. fork PRs) can't write the check, so
      # don't let a publish failure fail the run. The test step gates correctness.
      - name: Publish Test Results
        if: always()
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "ctest_results.xml"
      - name: Delete Test Artifact
        if: success()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: ${{ github.sha }}-tests
  flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
      volumes:
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
        - /opt/ghc:/opt/ghc1
        - /usr/local/share/boost:/usr/local/share/boost1
        - /opt/hostedtoolcache:/opt/hostedtoolcache1
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # PING: Flatpak is opt-in only. PING ships Windows (and macOS), not Linux, and
    # these two jobs cost ~2.6h per build (x86_64 alone is the longest job in the
    # whole run) only to be discarded. Everything needed to build it is still here:
    # scripts/flatpak/, the manifest and the icons are untouched.
    #
    # It was manual-only (any workflow_dispatch) until 2026-08-16. The problem: the
    # dev line is supposed to dispatch "Build all" after every C++ change, and these
    # two jobs are RED for a known reason, so the run's overall conclusion was always
    # "failure" - nobody could use "is the run green?" as a signal, and a genuinely
    # new breakage would hide behind the standing red. Eric ruled on 2026-08-16:
    # take it off the default dispatch path, keep the switch. Hence the input below.
    #
    # To run it: dispatch "Build all" with run-flatpak = true.
    # To turn it back on permanently, restore the upstream condition:
    #   if: ${{ !cancelled() && !vars.SELF_HOSTED && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    #
    # KNOWN BROKEN - two blockers, both must be fixed together (verified 2026-08-16
    # against run 31925931529, jobs 95113381923 / 95113382046, identical on both arches):
    #  1. Export fails: resources/images/OrcaSlicer.svg is 523.6x136.4, but flatpak
    #     requires a SQUARE app icon. That file serves two roles - the in-app dialog
    #     logo (wants the wide wordmark) and the scalable app icon (must be square).
    #     Fix by splitting them, not by reshaping the dialog logo.
    #  2. Upload would silently produce nothing: line ~242 hardcodes the upstream
    #     workspace /__w/OrcaSlicer/OrcaSlicer/, but this fork runs in
    #     /__w/PING-Slicer/PING-Slicer/. actions/upload-artifact defaults to
    #     if-no-files-found: warn, so fixing only (1) turns an honest red into a
    #     green job that ships no .flatpak. Fix the path AND set if-no-files-found: error.
    # Note also: because the job fails, its cache post-step is skipped, so the
    # flatpak-builder cache is never written - every attempt is a cold 1-2.6h build.
    if: ${{ !cancelled() && !vars.SELF_HOSTED && github.event_name == 'workflow_dispatch' && inputs.run-flatpak }}
    runs-on: ${{ matrix.variant.runner }}
    env:
      date:
      ver:
      ver_pure:
    steps:
    - name: "Remove unneeded stuff to free disk space"
      run:
        rm -rf /usr/local/lib/android/* /usr/share/dotnet/* /opt/ghc1/* "/usr/local/share/boost1/*" /opt/hostedtoolcache1/*
    - uses: actions/checkout@v6
    - name: Get the version and date
      run: |
        ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          ver="PR-${{ github.event.number }}"
          git_commit_hash="${{ github.event.pull_request.head.sha }}"
        else
          ver=V$ver_pure
          git_commit_hash="${{ github.sha }}"
        fi
        echo "ver=$ver" >> $GITHUB_ENV
        echo "ver_pure=$ver_pure" >> $GITHUB_ENV
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        echo "git_commit_hash=$git_commit_hash" >> $GITHUB_ENV
      shell: bash
    # Manage flatpak-builder cache externally so PRs restore but never upload
    - name: Restore flatpak-builder cache
      if: github.event_name == 'pull_request'
      uses: actions/cache/restore@v4
      with:
        path: .flatpak-builder
        key: flatpak-builder-${{ matrix.variant.arch }}-${{ github.event.pull_request.base.sha }}
        restore-keys: flatpak-builder-${{ matrix.variant.arch }}-
    - name: Save/restore flatpak-builder cache
      if: github.event_name != 'pull_request'
      uses: actions/cache@v4
      with:
        path: .flatpak-builder
        key: flatpak-builder-${{ matrix.variant.arch }}-${{ github.sha }}
        restore-keys: flatpak-builder-${{ matrix.variant.arch }}-
    - name: Disable debug info for faster CI builds
      run: |
        sed -i '/^build-options:/a\  no-debuginfo: true\n  strip: true' \
          scripts/flatpak/com.orcaslicer.OrcaSlicer.yml
      shell: bash
    - name: Inject git commit hash into Flatpak manifest
      run: |
        sed -i "/name: OrcaSlicer/{n;s|buildsystem: simple|buildsystem: simple\n    build-options:\n      env:\n        git_commit_hash: \"$git_commit_hash\"|}" \
          scripts/flatpak/com.orcaslicer.OrcaSlicer.yml
      shell: bash
    - uses: flatpak/flatpak-github-actions/flatpak-builder@master
      with:
        bundle: OrcaSlicer-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak
        manifest-path: scripts/flatpak/com.orcaslicer.OrcaSlicer.yml
        cache: false
        arch: ${{ matrix.variant.arch }}
        upload-artifact: false
    - name: Upload artifacts Flatpak
      uses: actions/upload-artifact@v6
      with:
        name: OrcaSlicer-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak
        path: '/__w/OrcaSlicer/OrcaSlicer/OrcaSlicer-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak'
    - name: Deploy Flatpak to nightly release
      if: github.repository == 'OrcaSlicer/OrcaSlicer' && github.ref == 'refs/heads/main'
      uses: WebFreak001/deploy-nightly@v3.2.0
      with:
        upload_url: https://uploads.github.com/repos/OrcaSlicer/OrcaSlicer/releases/137995723/assets{?name,label}
        release_id: 137995723
        asset_path: /__w/OrcaSlicer/OrcaSlicer/OrcaSlicer-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak
        asset_name: OrcaSlicer-Linux-flatpak_nightly_${{ matrix.variant.arch }}.flatpak
        asset_content_type: application/octet-stream
        max_releases: 1 # optional, if there are more releases than this matching the asset_name, the oldest ones are going to be deleted

