<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尚未連接機器</title>
<style>
  /* PING CIS：白底為主、Charcoal 文字、橘只當 accent */
  :root { --ink:#202221; --orange:#EA4E16; --gray:#EFEFEF; --mid:#666; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:"Noto Sans TC","Source Han Sans TC","Microsoft JhengHei",sans-serif;
    color:var(--ink); background:#fff;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap { max-width:720px; width:100%; text-align:center; }
  h1 {
    font-family:"Noto Serif TC","Source Han Serif TC","PMingLiU",serif;
    font-size:30px; margin-bottom:8px;
  }
  .sub { color:var(--mid); font-size:15px; margin-bottom:30px; }

  /* 連線示意動畫：電腦 ⇢(Wi-Fi 波紋)⇢ PING 機器 */
  .diagram { display:flex; align-items:center; justify-content:center; gap:26px; margin:0 auto 34px; }
  .node { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .node .label { font-size:13.5px; color:var(--mid); }
  svg .stroke { stroke:var(--ink); stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  /* Wi-Fi 三道波紋輪播 */
  .wave { stroke:var(--orange); stroke-width:6; fill:none; stroke-linecap:round; opacity:0; animation:pulse 2.4s infinite; }
  .wave.w2 { animation-delay:.4s; }
  .wave.w3 { animation-delay:.8s; }
  .dot { fill:var(--orange); animation:blink 2.4s infinite; }
  @keyframes pulse { 0%{opacity:0} 25%{opacity:1} 60%{opacity:1} 100%{opacity:0} }
  @keyframes blink { 0%,100%{opacity:.5} 50%{opacity:1} }

  /* 三步驟 */
  .steps { display:flex; gap:14px; text-align:left; margin-bottom:26px; }
  .step { flex:1; background:var(--gray); border-radius:10px; padding:14px 16px; }
  .step .n {
    display:inline-block; width:26px; height:26px; border-radius:50%;
    background:var(--orange); color:#fff; text-align:center; line-height:26px;
    font-size:14px; font-weight:bold; margin-bottom:8px;
  }
  .step b { display:block; font-size:15px; margin-bottom:4px; }
  .step span { font-size:13.5px; color:var(--mid); line-height:1.6; display:block; }
  .step .hl { color:var(--ink); font-weight:bold; }

  .foot { font-size:13px; color:var(--mid); }
  @media (max-width:640px){ .steps{flex-direction:column} }
</style>
</head>
<body>
  <div class="wrap">
    <h1>尚未連接機器</h1>
    <p class="sub">設定好機器連線後，這一頁就會顯示機器的控制畫面（溫度、進度、鏡頭）。</p>

    <div class="diagram" aria-hidden="true">
      <div class="node">
        <!-- 電腦 -->
        <svg width="96" height="84" viewBox="0 0 96 84">
          <rect class="stroke" x="10" y="10" width="76" height="48" rx="6"/>
          <line class="stroke" x1="30" y1="72" x2="66" y2="72"/>
          <line class="stroke" x1="48" y1="58" x2="48" y2="72"/>
        </svg>
        <div class="label">這台電腦</div>
      </div>
      <div class="node">
        <!-- Wi-Fi 波紋（動畫） -->
        <svg width="110" height="84" viewBox="0 0 110 84">
          <circle class="dot" cx="18" cy="42" r="6"/>
          <path class="wave w1" d="M 34 24 A 26 26 0 0 1 34 60"/>
          <path class="wave w2" d="M 52 14 A 40 40 0 0 1 52 70"/>
          <path class="wave w3" d="M 70 4  A 55 55 0 0 1 70 80"/>
        </svg>
        <div class="label">同一個網路</div>
      </div>
      <div class="node">
        <!-- 3D 列印機（簡筆示意） -->
        <svg width="84" height="84" viewBox="0 0 84 84">
          <rect class="stroke" x="10" y="6" width="64" height="72" rx="6"/>
          <line class="stroke" x1="10" y1="24" x2="74" y2="24"/>
          <rect class="stroke" x="34" y="24" width="16" height="12"/>
          <line class="stroke" x1="42" y1="36" x2="42" y2="44"/>
          <line class="stroke" x1="20" y1="62" x2="64" y2="62"/>
        </svg>
        <div class="label">PING 機器</div>
      </div>
    </div>

    <div class="steps">
      <div class="step"><span class="n">1</span>
        <b>機器開機、接上網路</b>
        <span>讓機器和這台電腦在<span class="hl">同一個網路</span>（有線或 Wi-Fi 都可以）。</span>
      </div>
      <div class="step"><span class="n">2</span>
        <b>查機器的 IP 位址</b>
        <span>在機器<span class="hl">觸控面板</span>的網路資訊頁可以看到，例如 <span class="hl">192.168.1.135</span>。</span>
      </div>
      <div class="step"><span class="n">3</span>
        <b>回「準備」頁填 IP</b>
        <span>點「列印設備」右上的<span class="hl">連線圖示</span>，輸入機器 IP 並儲存，這一頁就會出現機器畫面。</span>
      </div>
    </div>

    <p class="foot">連不上？先確認電腦能開啟 http://機器IP ，或聯絡 PING 客服協助。</p>
  </div>
</body>
</html>
